# The checks a commit on main must pass before it is served. playbigfight.com runs on a
# self-hosted machine that follows main: every five minutes it looks for a new commit, waits
# for this workflow's `validate` job to pass on it, then builds server/Dockerfile from that
# commit and swaps it in. Nothing here deploys, so the job's name is the contract: renaming
# `validate` stops new commits from going live.
name: Validate main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-main
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ${{ vars.GARRISON_RUNNER || vars.HEAVY_RUNNER || vars.LHS_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - run: npx playwright install --with-deps chromium
        if: runner.environment == 'github-hosted'
      - run: npx playwright install chromium
        if: runner.environment == 'self-hosted'
      - run: npm run check
      - run: node --import tsx --test src/mockup/styles/motion.test.ts src/rigs/ApprovedRig.test.ts
      - run: npm run server:test
      - run: npm run net:unit
      - run: npm run net:test
      - run: npm run net:lobby-test
      - run: npm run net:ui-test
      - run: node scripts/replay-ci.mjs
