app = "bigfight-arena-preview"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    VITE_ARENA_PREVIEW = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "20s"
    method = "GET"
    timeout = "3s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
